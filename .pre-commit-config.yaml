# Hooks are wired through .githooks (core.hooksPath), which runs ruff on staged files.
# This file lets `uv run pre-commit run --all-files` work on demand.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
