version: 1
# Walk-word lists for the mission safety filter (PRD FR-M4, FR-M6, FR-M6b).
# generic_nouns: nouns a mission may use without referencing a fact (FR-M4). Everything else concrete must come from a referenced fact's subject/place.
generic_nouns: [tree, trees, flower, flowers, bird, birds, sky, sound, sounds, smell, smells, colour, colours, color, colors, leaf, leaves, cloud, clouds, path, lane, road, wall, window, door, gate, building, light, lights, shadow, shadows, sign, signs, wind, breeze, way, walk, thing, things, something, one, kind, shape, shapes, plant, plants, person, people, animal, animals, home, corner, side, route, street, pavement, footpath, shade, sunlight, noise, noises, voice, voices, pattern, patterns, number, pair, group, detail, details, difference, changes, change, moment, minute, minutes, step, steps, distance, surface, ground, air, view, spot, place, places, edge, end, top, bottom, front, back, roof, roofs, fence, railing, pole, board, branch, branches, trunk, bark, grass, garden, park, neighbourhood, neighborhood, area, stretch, bend, turn, curve, crossing, bench, shop, shops, stall, stalls, wire, wires, rooftop, rooftops, hill, puddle, puddles, stone, stones, colourful, everything, anything, time, times, day, days, week, weeks, today, yesterday, start, lot, lots, bit, while, face]
# verb_allowlist: base forms of the permitted main verbs (FR-M6a). The safety code handles inflections.
verb_allowlist: [notice, look, see, listen, hear, count, smell, find, spot, compare, stand, pause, watch]
# blocklist (FR-M6b): each item is {id, patterns}. Patterns are Python `re` regexes, applied with re.IGNORECASE
# to the mission text after NFC normalisation and whitespace collapse; a match on ANY pattern rejects the mission.
# Latin patterns are word-boundaried. Devanagari patterns are substring matches (\b is unreliable with matras).
# Intentionally conservative: a false reject costs only a regeneration/fallback. Tested in tests/unit (see report for the table).
blocklist:
  - id: road_crossing   # crossing or stopping on roads
    patterns:
      - '\bcross(?:es|ed|ing)?\s+(?:over\s+)?(?:\w+\s+){0,3}?(?:roads?|streets?|lanes?|highways?|junctions?|intersections?|crossings?|zebra|traffic|signals?|flyovers?|tracks?|railway|rails?)\b'
      - '\bcross(?:es|ed|ing)?\s+(?:over|across|to the other side|to the opposite side)\b'
      - '\b(?:to|on|at)\s+the\s+(?:other|opposite|far)\s+side\s+of\s+the\s+(?:road|street|lane|highway)\b'
      - '\b(?:stand|stop|pause|wait|stay|linger|stand still|rest|sit|halt)(?:s|ing)?\s+(?:(?:right|just|there|here|still|and|for a moment|for a minute|for a bit)\s+)?(?:on|in|at|along|down|onto|into|across)\s+(?:the\s+|a\s+|that\s+|this\s+)?(?:middle of the\s+|centre of the\s+|center of the\s+|edge of the\s+)?(?:road|roads|street|streets|lane|lanes|highway|traffic|junction|crossing|carriageway)\b'
      - '\b(?:walk|stroll|wander|loiter|dawdle)(?:s|ing)?\s+(?:(?:right|just|there|here|still|and)\s+)?(?:on|in|at|along|down|onto|into|across)\s+(?:the\s+|a\s+|that\s+|this\s+)?(?:middle of the\s+|centre of the\s+|center of the\s+|edge of the\s+)?(?:road|roads|street|streets|highway|traffic|junction|crossing|carriageway)\b'
      - '\b(?:step|stepping|steps|stepped|go|going|walk|walking|move|moving|spill|wander|drift)\s+(?:out\s+)?(?:onto|on to|into|off(?: the)? (?:footpath|pavement|kerb|curb|sidewalk)|off to the road)\s+(?:the\s+|a\s+)?(?:road|roads|street|streets|lane|lanes|traffic|carriageway)\b'
      - '\bstep(?:s|ping|ped)?\s+(?:off|down from)\s+(?:the\s+)?(?:footpath|pavement|kerb|curb|sidewalk)\b'
      - '\b(?:through|into|between|among|dodge|dodging|weave|weaving)\s+(?:the\s+|moving\s+|passing\s+|oncoming\s+)?(?:traffic|vehicles|cars|buses|autos)\b'
      - '\b(?:in|on)\s+the\s+(?:middle|centre|center)\s+of\s+the\s+(?:road|street|lane|junction)\b'
      - '\bsadak\s+(?:paar|par|ke\s+beech|ke\s+bichon)\b'
      - '\b(?:road|sadak|rasta|raasta)\s+(?:cross|paar)\s*(?:karo|karna|kar|kijiye|kare)?\b'
      - '\bpaar\s+(?:karo|karna|kijiye)\b'
      - 'सड़क\s*(?:पार|पर|के बीच)'
  - id: touch_animal   # touching, petting, holding, approaching animals
    patterns:
      - '\b(?:touch|touches|touched|touching|pet|pets|petting|petted|pat|pats|patting|patted|stroke|strokes|stroking|stroked|hug|hugs|hugging|cuddle|cuddling|cuddles|scratch|scratching|tickle|tickling|rub|rubbing|poke|poking|tease|teasing|squeeze|squeezing|kiss|kissing|ride|riding|pull|pulling|grab|grabbing|catch|catching|capture|trap|tame|shoo|shooing|disturb|disturbing|bother|bothering|wake|waking|startle|startling|pinch|pinching|brush|brushing|pick\s+up|picking\s+up|lift|lifting|carry|carrying|cradle|cradling|handle|handling)\s+(?:the\s+|a\s+|an\s+|that\s+|this\s+|any\s+|some\s+|your\s+|each\s+)?(?:\w+\s+){0,2}?(?:dogs?|pupp(?:y|ies)|pups?|cats?|kittens?|cows?|calf|calves|bulls?|bullocks?|buffalo(?:es)?|goats?|kids? goats?|sheep|horses?|ponies|pony|donkeys?|mules?|camels?|monkeys?|langurs?|squirrels?|rats?|mice|mouse|snakes?|lizards?|geckos?|frogs?|cattle|animals?|strays?|pigs?|boars?|hens?|chickens?|roosters?|ducks?|geese|birds?|crows?|pigeons?|parrots?|sparrows?|mynas?|koels?|kites?|peacocks?|peahens?|owls?|bats?|butterfl(?:y|ies)|bees?|insects?|creatures?|wildlife|kutt[aeoi]n?|kutte|billi|billa|gaay|gai|gaayein|bail|bhains|bakri|bakra|ghoda|ghode|gadha|bandar|gilahri|chuha|saanp|chidiya|kauwa|kaua|tota|kabutar|kabootar|murgi|cheel)\b'
      - '\b(?:stroke|stroking|stroked|pet|petting|pat|patting|hug|hugging|cuddle|cuddling|scratch|scratching|pick\s+(?:it|them|him|her)\s+up|picking\s+(?:it|them|him|her)\s+up)\s+(?:it|them|him|her|the animal|its\s+(?:head|back|fur|ears?|tail))\b'
      - '\bhold(?:s|ing)?\s+(?:the\s+|a\s+|an\s+|that\s+)?(?:\w+\s+){0,1}?(?:dogs?|pupp(?:y|ies)|pups?|cats?|kittens?|cows?|calf|calves|bulls?|bullocks?|buffalo(?:es)?|goats?|kids? goats?|sheep|horses?|ponies|pony|donkeys?|mules?|camels?|monkeys?|langurs?|squirrels?|rats?|mice|mouse|snakes?|lizards?|geckos?|frogs?|cattle|animals?|strays?|pigs?|boars?|hens?|chickens?|roosters?|ducks?|geese|birds?|crows?|pigeons?|parrots?|sparrows?|mynas?|koels?|kites?|peacocks?|peahens?|owls?|bats?|butterfl(?:y|ies)|bees?|insects?|creatures?|wildlife|kutt[aeoi]n?|kutte|billi|billa|gaay|gai|gaayein|bail|bhains|bakri|bakra|ghoda|ghode|gadha|bandar|gilahri|chuha|saanp|chidiya|kauwa|kaua|tota|kabutar|kabootar|murgi|cheel)\b'
      - '\b(?:play|plays|playing)\s+with\s+(?:the\s+|a\s+|an\s+|that\s+)?(?:\w+\s+){0,1}?(?:dogs?|pupp(?:y|ies)|pups?|cats?|kittens?|cows?|calf|calves|bulls?|bullocks?|buffalo(?:es)?|goats?|kids? goats?|sheep|horses?|ponies|pony|donkeys?|mules?|camels?|monkeys?|langurs?|squirrels?|rats?|mice|mouse|snakes?|lizards?|geckos?|frogs?|cattle|animals?|strays?|pigs?|boars?|hens?|chickens?|roosters?|ducks?|geese|birds?|crows?|pigeons?|parrots?|sparrows?|mynas?|koels?|kites?|peacocks?|peahens?|owls?|bats?|butterfl(?:y|ies)|bees?|insects?|creatures?|wildlife|kutt[aeoi]n?|kutte|billi|billa|gaay|gai|gaayein|bail|bhains|bakri|bakra|ghoda|ghode|gadha|bandar|gilahri|chuha|saanp|chidiya|kauwa|kaua|tota|kabutar|kabootar|murgi|cheel)\b'
      - '\b(?:approach|approaching|approaches|go\s+up\s+to|walk\s+up\s+to|go\s+near|walk\s+near|get\s+close\s+to|getting\s+close\s+to|move\s+closer\s+to|go\s+close\s+to|come\s+(?:near|close)\s+to|sneak\s+up\s+on|step\s+closer\s+to|walk\s+(?:towards?|toward)|go\s+(?:towards?|toward)|head\s+(?:towards?|toward))\s+(?:the\s+|a\s+|an\s+|that\s+)?(?:\w+\s+){0,1}?(?:dogs?|pupp(?:y|ies)|pups?|cats?|kittens?|cows?|calf|calves|bulls?|bullocks?|buffalo(?:es)?|goats?|kids? goats?|sheep|horses?|ponies|pony|donkeys?|mules?|camels?|monkeys?|langurs?|squirrels?|rats?|mice|mouse|snakes?|lizards?|geckos?|frogs?|cattle|animals?|strays?|pigs?|boars?|hens?|chickens?|roosters?|ducks?|geese|birds?|crows?|pigeons?|parrots?|sparrows?|mynas?|koels?|kites?|peacocks?|peahens?|owls?|bats?|butterfl(?:y|ies)|bees?|insects?|creatures?|wildlife|kutt[aeoi]n?|kutte|billi|billa|gaay|gai|gaayein|bail|bhains|bakri|bakra|ghoda|ghode|gadha|bandar|gilahri|chuha|saanp|chidiya|kauwa|kaua|tota|kabutar|kabootar|murgi|cheel)\b'
      - '\b(?:chhoo|chhu|chhuo|chhoona|chhuna|chhuiye|chhoiye|chhoo\s+lo|chhu\s+lo|sehla|sehlao|sehlana|pyaar\s+se\s+haath|haath\s+phero|haath\s+lagao|haath\s+lagana|god\s+mein\s+utha\w*|gode\s+mein\s+utha\w*|pakdo|pakadna|pakadiye|pakad\s+lo)\b'
      - 'छू(?:ना|ओ|एं|ए|ये)|सहला|गोद में उठा|पकड़ो|पकड़ना'
  - id: feed_animal   # feeding or giving food/water to animals
    patterns:
      - '\b(?:feed|feeds|feeding|fed)\s+(?:the|it|them|him|her|some|a|an|any|your|that|this|those|these|one|every|each|all|my|our|their)\b'
