      - '\b(?:give|gives|giving|offer|offers|offering|toss|tossing|throw|throwing|put\s+out|pass|passing|hand|handing|leave|leaving|bring|bringing|share|sharing|pour|pouring|set\s+out|scatter|scattering|sprinkle|sprinkling)\s+(?:\w+\s+){0,4}?(?:food|biscuits?|rotis?|chapatis?|breads?|pav|milk|water|treats?|snacks?|grains?|seeds?|dana|rice|bananas?|fruits?|scraps?|leftovers?|sweets?|chocolates?|toffees?|candy|candies|money|coins?|rupees?|cash|gifts?|flowers?|khana|paani|dudh|bisk(?:i|u)t)\s+(?:\w+\s+){0,2}?(?:to|for|near)\s+(?:the\s+|a\s+|an\s+|that\s+|some\s+)?(?:\w+\s+){0,1}?(?:dogs?|pupp(?:y|ies)|pups?|cats?|kittens?|cows?|calf|calves|bulls?|bullocks?|buffalo(?:es)?|goats?|kids? goats?|sheep|horses?|ponies|pony|donkeys?|mules?|camels?|monkeys?|langurs?|squirrels?|rats?|mice|mouse|snakes?|lizards?|geckos?|frogs?|cattle|animals?|strays?|pigs?|boars?|hens?|chickens?|roosters?|ducks?|geese|birds?|crows?|pigeons?|parrots?|sparrows?|mynas?|koels?|kites?|peacocks?|peahens?|owls?|bats?|butterfl(?:y|ies)|bees?|insects?|creatures?|wildlife|kutt[aeoi]n?|kutte|billi|billa|gaay|gai|gaayein|bail|bhains|bakri|bakra|ghoda|ghode|gadha|bandar|gilahri|chuha|saanp|chidiya|kauwa|kaua|tota|kabutar|kabootar|murgi|cheel)\b'
