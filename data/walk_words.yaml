# time_of_day_words (FR-M6b): mission text must not contain any of these. Match case-insensitively; Latin words on word boundaries, Devanagari as substrings.
time_of_day_words:
  - 'morning'
  - 'noon'
  - 'midday'
  - 'afternoon'
  - 'evening'
  - 'at night'   # bare 'night' is allowed (night jasmine); these literal cues stay banned
  - 'this night'
  - 'last night'
  - 'tomorrow night'
  - 'every night'
  - 'each night'
  - 'one night'
  - 'by night'
  - 'in the night'
  - 'into the night'
  - 'during the night'
  - 'all night'
  - 'night air'
  - 'night sky'
  - 'night breeze'
  - 'night walk'
  - 'night time'
  - 'night-time'
  - 'nighttime'
  - 'overnight'
  - 'tonight'
  - 'today at'
  - 'sunset'   # review: KNOWN OVERLAP: also a lexicon sky detail (id sunset); in a mission it is a time-of-day cue, so rejected here
  - 'sunrise'   # review: overlaps lexicon id sunrise, same as sunset
  - 'dusk'   # review: overlaps lexicon id twilight
  - 'dawn'
  - 'o''clock'
  - 'am'   # review: collides with English "I am"; match only after a digit (e.g. 5 am) or as "a.m."
  - 'pm'   # review: match only after a digit or as "p.m."
  - 'lunch'   # review
