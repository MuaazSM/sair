name: ci

on:
  push:
    branches: [main, overnight/mvp]
  pull_request:
    branches: [main, overnight/mvp]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stubbed models only; nothing is downloaded at test time and no telemetry is sent.
  SAIR_ENV: test
  SENTRY_DSN: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Local-only paths are not tracked
        # docs/, .claude/ and every Markdown file except READMEs and hub/prompts stay local.
        run: |
          bad="$(git ls-files | grep -E '^(docs/|\.claude/|eval/real/|models/)|\.md$|(^|/)\.env($|\.)' \
            | grep -vE '(^|/)README\.md$|^hub/prompts/|\.env[^/]*\.example$' || true)"
          if [ -n "$bad" ]; then echo "tracked local-only files:"; echo "$bad"; exit 1; fi

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install (default deps + dev group; no training/tts extras)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check hub tests eval scripts training

      - name: Mypy (strict, hub)
        run: uv run mypy --strict hub

      - name: Tests (unit, integration, privacy; stubbed models)
        run: uv run pytest tests/unit tests/integration tests/privacy -m "not gpu" -q

      - name: Cached eval against the baseline
        # Replays the committed model-call cache; no model servers needed.
        if: hashFiles('eval/baseline.json') != ''
        run: uv run python eval/run.py --cached --no-grammar-pass --assert-baseline eval/baseline.json --out "$RUNNER_TEMP/eval"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual, text and axe checks
        # Compares against the committed PNGs in tests/visual/reference (no design export needed).
        # Font rasterisation on Linux differs from macOS, so pixel diffs can exceed the 2% limit
        # here; the binding visual check runs on the Mac. Text and axe results are still shown.
        continue-on-error: true
        run: npx playwright test tests/visual/screens.spec.ts

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: web/tests/visual/diff/
          if-no-files-found: ignore
          retention-days: 7
